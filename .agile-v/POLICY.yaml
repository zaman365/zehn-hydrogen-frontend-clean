# Agile V Policy — zehn-hydrogen-frontend
# Version: 1.0.0 | Cycle: C1

policy_version: "1.0.0"
cycle: C1
project: zehn-hydrogen-frontend

traceability:
  require_req_id: true
  require_decision_log_on_defer: true
  require_build_manifest_on_code_change: true

gates:
  gate_1:
    name: Requirements & validation approval
    required_artifacts:
      - REQUIREMENTS.md
      - phases/02-validation/SUMMARY.md
    approver: stakeholder
  gate_2:
    name: Release / sprint acceptance
    required_artifacts:
      - VALIDATION_SUMMARY.md
      - EVAL_RESULTS.md
      - TEST_SPEC.md
    eval_gate_required: true
    approver: stakeholder

halt_conditions:
  - ambiguous_req
  - missing_traceability
  - req_conflict
  - modify_frozen_path_without_approval

frozen_constraints:
  - id: header_stack
    req: REQ-0004
    paths:
      - app/components/zehn/AnnouncementBar.tsx
      - app/components/zehn/Header.tsx
      - app/components/PageLayout.tsx
      - app/lib/site-header-stack.ts
      - app/styles/homepage-hero.css
  - id: brand_tokens
    req: REQ-0001
    paths:
      - app/lib/design-tokens.ts

verification:
  min_before_commit:
    - npm run typecheck
  visual_breakpoints: [390, 1280, 1440, 1920]

scope:
  in_scope:
    - app/components/zehn/**
    - app/routes/**
    - app/styles/**
  out_of_scope:
    - req: REQ-0019
      path: .full-stack-feature/
    - req: REQ-0020
      note: SEO tooling backlog
